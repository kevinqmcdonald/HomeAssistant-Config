######################################################################
# -------------------------------------------------------------------
# Walnut theme
#  Dark-only house theme: walnut photo background, frosted glass tiles,
#  white Inter text, blue-led accents with gold for "on".
#  Tokens (--wn-*) are the single source of style for every dashboard.
#  See .claude/reference/dashboard-style-guide.md and
#  .claude/designs/2026-11-23-walnut-theme.md (variant B "Smoked blue").
#  Needs: www/backgrounds/walnut.jpg, and the Lovelace css resource
#  /local/fonts/inter.css for the font (falls back to system sans-serif).
# -------------------------------------------------------------------
######################################################################

Walnut:
  card-mod-theme: Walnut

  # --- Tokens -------------------------------------------------------
  wn-dim: "0.45"
  wn-bg-image: 'url("/local/backgrounds/walnut.jpg")'
  wn-surface: "rgba(14, 10, 7, 0.62)"
  wn-surface-strong: "rgba(14, 10, 7, 0.82)"
  wn-border: "rgba(200, 220, 240, 0.14)"
  wn-blur: "20px"
  wn-text: "#ffffff"
  wn-text-secondary: "rgba(225, 235, 245, 0.70)"
  wn-text-disabled: "rgba(225, 235, 245, 0.38)"
  wn-accent-blue: "#7fb3e6"
  wn-accent-gold: "#e6c15a"
  wn-accent-tan: "#c9a27a"
  wn-ok: "#8cc79a"
  wn-warn: "#f2b04c"
  wn-alert: "#ec7766"
  # RGB triplets for translucent tints: rgba(var(--wn-rgb-*), alpha)
  wn-rgb-ok: "140, 199, 154"
  wn-rgb-warn: "242, 176, 76"
  wn-rgb-alert: "236, 119, 102"
  wn-radius: "16px"
  wn-gap: "14px"
  wn-touch-min: "48px"
  wn-icon-size: "28px"
  wn-font: '"Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'
  wn-font-xs: "12px"
  wn-font-sm: "14px"
  wn-font-md: "16px"
  wn-font-lg: "20px"
  wn-font-xl: "28px"

  # --- Background ---------------------------------------------------
  # Kept literal: lovelace-background is parsed as a CSS background shorthand.
  # Values mirror wn-dim (0.45) and wn-bg-image; change them together.
  lovelace-background: >-
    linear-gradient(rgba(10, 6, 3, 0.45), rgba(10, 6, 3, 0.45)) fixed,
    url("/local/backgrounds/walnut.jpg") center / cover no-repeat fixed #16100b

  # --- Typography ---------------------------------------------------
  primary-font-family: var(--wn-font)
  ha-font-family-body: var(--wn-font)
  ha-font-family-heading: var(--wn-font)

  # --- Base palette --------------------------------------------------
  # Top level on purpose, so it applies whatever the device's light/dark
  # setting is (a dark-only block would leave dark text on dark glass in
  # light mode). primary-color / accent-color stay literal hex because HA
  # derives rgb-primary-color etc. from them in JavaScript.
  primary-color: "#7fb3e6"
  accent-color: "#e6c15a"
  primary-background-color: "#16100b"
  secondary-background-color: "#211810"
  primary-text-color: var(--wn-text)
  secondary-text-color: var(--wn-text-secondary)
  disabled-text-color: var(--wn-text-disabled)
  text-primary-color: "#0e0a07"
  divider-color: var(--wn-border)

  # State colours: gold means "on"
  state-icon-color: var(--wn-text-secondary)
  state-light-active-color: var(--wn-accent-gold)
  state-switch-active-color: var(--wn-accent-gold)
  state-fan-active-color: var(--wn-accent-gold)
  state-media_player-active-color: var(--wn-accent-blue)
  state-alarm_control_panel-disarmed-color: var(--wn-ok)
  state-alarm_control_panel-armed_home-color: var(--wn-accent-blue)
  state-alarm_control_panel-armed_away-color: var(--wn-accent-blue)
  state-alarm_control_panel-triggered-color: var(--wn-alert)
  # Presence: same green as "safe" states, so badges and wn_status agree
  state-person-home-color: var(--wn-ok)
  state-person-not_home-color: var(--wn-text-secondary)
  state-device_tracker-home-color: var(--wn-ok)
  state-device_tracker-not_home-color: var(--wn-text-secondary)
  # Any other zone (e.g. "Work", "Driving")
  state-person-zone-color: var(--wn-accent-tan)
  state-device_tracker-zone-color: var(--wn-accent-tan)

  # Chrome
  app-header-background-color: "rgba(12, 8, 5, 0.6)"
  app-header-text-color: var(--wn-text)
  sidebar-background-color: "rgba(12, 8, 5, 0.88)"
  sidebar-text-color: var(--wn-text)
  sidebar-icon-color: var(--wn-text-secondary)
  sidebar-selected-icon-color: var(--wn-accent-gold)
  sidebar-selected-text-color: var(--wn-accent-gold)
  ha-dialog-surface-background: var(--secondary-background-color)

  # --- Cards --------------------------------------------------------
  ha-card-background: var(--wn-surface)
  card-background-color: var(--wn-surface)
  ha-card-border-color: var(--wn-border)
  ha-card-border-width: "1px"
  ha-card-border-radius: var(--wn-radius)
  ha-card-box-shadow: "0 6px 20px rgba(0, 0, 0, 0.25)"
  feature-height: var(--wn-touch-min)
  feature-border-radius: "10px"

  # --- Mushroom / Bubble follow the same tokens ----------------------
  mush-card-primary-font-size: var(--wn-font-md)
  mush-card-secondary-font-size: var(--wn-font-sm)
  mush-icon-size: "44px"
  mush-control-height: var(--wn-touch-min)
  bubble-main-background-color: var(--wn-surface)
  bubble-pop-up-background-color: var(--wn-surface-strong)
  bubble-border-radius: var(--wn-radius)

  # Declaring a dark mode lets HA use its dark defaults for anything this
  # theme doesn't set (inputs, editors) on devices in dark mode.
  modes:
    dark:
      wn-mode: dark

  # --- Global card-mod rules ----------------------------------------
  # hui-card-features and ha-tile-info set their own sizes on :host, so theme
  # variables alone never reach them; set them on the elements from outside.
  # Tile text: name 16px / state 14px, so it's readable on the wall tablet.
  card-mod-card: |
    ha-card {
      backdrop-filter: blur(var(--wn-blur));
      -webkit-backdrop-filter: blur(var(--wn-blur));
    }
    hui-card-features {
      --feature-height: var(--wn-touch-min);
    }
    ha-tile-info {
      --ha-tile-info-primary-font-size: var(--wn-font-md);
      --ha-tile-info-secondary-font-size: var(--wn-font-sm);
      --tile-info-primary-font-size: var(--wn-font-md);
      --tile-info-secondary-font-size: var(--wn-font-sm);
    }
