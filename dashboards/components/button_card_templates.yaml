######################################################################
# -------------------------------------------------------------------
# House components - button-card templates
#  Shared by every dashboard via
#  `button_card_templates: !include components/button_card_templates.yaml`.
#  Values come only from theme tokens (--wn-*); see
#  .claude/reference/dashboard-style-guide.md for the component index.
# -------------------------------------------------------------------
######################################################################

# Base for every house button. The frosted surface, border and radius come from
# the theme's card-mod-card rule (it styles every ha-card), so they are not repeated here.
wn_base:
  section_mode: true
  show_state: false
  styles:
    card:
      - min-height: var(--wn-touch-min)
      - padding: var(--wn-gap)
      - font-family: var(--wn-font)
      - color: var(--wn-text)
    name:
      - font-size: var(--wn-font-md)
      - color: var(--wn-text)
    label:
      - font-size: var(--wn-font-sm)
      - color: var(--wn-text-secondary)
    state:
      - font-size: var(--wn-font-sm)
      - color: var(--wn-text-secondary)
    icon:
      - color: var(--wn-accent-gold)
      - width: var(--wn-icon-size)

# Full-width status banner for a binary entity: warn styling when "on", ok when "off".
# Set entity, name and label on the card.
wn_alert:
  template: wn_base
  show_label: true
  layout: icon_name_label
  styles:
    grid:
      - grid-template-areas: '"i n" "i l"'
      - grid-template-columns: var(--wn-touch-min) 1fr
      - justify-items: start
      - column-gap: var(--wn-gap)
    name:
      - font-size: var(--wn-font-lg)
      - font-weight: 600
      - justify-self: start
      - text-align: left
    label:
      - justify-self: start
      - text-align: left
    icon:
      - color: var(--wn-ok)
  state:
    - value: "on"
      icon: mdi:alert
      styles:
        card:
          - border-color: var(--wn-warn)
          - background: rgba(var(--wn-rgb-warn), 0.20)
        icon:
          - color: var(--wn-warn)
    - value: "off"
      icon: mdi:shield-check

# Key status readable across the room: small name above a large state.
# Set entity and name on the card. Tap opens more-info.
wn_status:
  template: wn_base
  show_state: true
  layout: icon_name_state2nd
  tap_action:
    action: more-info
  styles:
    grid:
      - grid-template-areas: '"i n" "i s"'
      - grid-template-columns: var(--wn-touch-min) 1fr
      - column-gap: var(--wn-gap)
    name:
      - justify-self: start
      - font-size: var(--wn-font-sm)
      - color: var(--wn-text-secondary)
    # State shrinks from --wn-font-xl (28px) towards --wn-font-lg (20px) as the card
    # narrows (container units), so a half-width card on the phone fits "Driving".
    card:
      - container-type: inline-size
    state:
      - justify-self: start
      - font-size: clamp(var(--wn-font-lg), 12cqi, var(--wn-font-xl))
      - font-weight: 600
      - color: var(--wn-text)
      - white-space: normal
      - text-align: left
    # Icon follows the theme's state colour (e.g. disarmed / home = --wn-ok green),
    # so it matches tiles and badges for the same entity. Gold if the theme has none.
    # A person/device_tracker in any other zone uses HA's "zone" state colour.
    icon:
      - color: >-
          [[[
            const d = entity.entity_id.split('.')[0];
            let s = entity.state;
            if (['person', 'device_tracker'].includes(d) && !['home', 'not_home'].includes(s)) s = 'zone';
            return `var(--state-${d}-${s}-color, var(--wn-accent-gold))`;
          ]]]
